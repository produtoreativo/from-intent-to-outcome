  <text x="528" y="318" font-size="9" fill="#6B7280">Causa: custo perc. de atraso &gt; lacuna</text>
  <text x="528" y="331" font-size="9" fill="#6B7280">Sinal: findings abertos sem waiver</text>
  <rect x="530" y="340" width="220" height="42" fill="#D1FAE5" stroke="#10B981" stroke-width="1" rx="3"/>
  <text x="640" y="356" text-anchor="middle" font-size="9" fill="#065F46" font-weight="600">✓ PI-001: perguntas abertas</text>
  <text x="640" y="369" text-anchor="middle" font-size="9" fill="#065F46">classificadas como "refinamento"</text>
  <text x="640" y="382" text-anchor="middle" font-size="9" fill="#065F46">lacunas nomeadas, não ocultadas</text>

