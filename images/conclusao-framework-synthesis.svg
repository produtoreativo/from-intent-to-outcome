<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" width="100%" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="720" fill="#F9FAFB" rx="8"/>
  <text x="460" y="26" text-anchor="middle" font-size="14" fill="#374151" font-weight="700">Síntese do Framework ProdOps — do problema ao compromisso com evidência</text>
  <text x="460" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Conclusão: de "guarde essa palavra" à operacionalização — Magazine Siará como encerramento do arco</text>

  <defs>
    <marker id="aGrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#10B981"/></marker>
    <marker id="aBlC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/></marker>
    <marker id="aOrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
    <marker id="aGyC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9CA3AF"/></marker>
    <marker id="aPuC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/></marker>
    <marker id="aRdC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#EF4444"/></marker>
  </defs>

  <!-- ── Row 1: Problem → Modes ── -->

  <!-- Problem -->
  <rect x="10" y="58" width="200" height="90" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="8"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#DC2626" font-weight="700">O Problema</text>
  <text x="110" y="97" text-anchor="middle" font-size="9" fill="#374151">Times operam com dois tipos</text>
  <text x="110" y="111" text-anchor="middle" font-size="9" fill="#374151">de comprometimento distintos</text>
  <text x="110" y="125" text-anchor="middle" font-size="9" fill="#374151">sem distingui-los explicitamente</text>
  <text x="110" y="139" text-anchor="middle" font-size="9" fill="#DC2626" font-weight="600">→ rigor aplicado errado</text>
  <line x1="210" y1="103" x2="238" y2="103" stroke="#374151" stroke-width="1.5" marker-end="url(#aGyC)"/>

  <!-- Two modes -->
  <rect x="240" y="58" width="160" height="90" fill="#E0F2FE" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="320" y="80" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="700">Upstream</text>
  <text x="320" y="96" text-anchor="middle" font-size="9" fill="#374151">Rigor consultivo</text>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#374151">Incerteza explícita</text>
  <text x="320" y="124" text-anchor="middle" font-size="9" fill="#374151">Evidence Package</text>
  <text x="320" y="138" text-anchor="middle" font-size="9" fill="#1D4ED8">Pergunta → Aprendizado</text>

  <rect x="412" y="58" width="160" height="90" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="8"/>
  <text x="492" y="80" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Downstream</text>
  <text x="492" y="96" text-anchor="middle" font-size="9" fill="#374151">Rigor bloqueante</text>
  <text x="492" y="110" text-anchor="middle" font-size="9" fill="#374151">Compromisso verificável</text>
  <text x="492" y="124" text-anchor="middle" font-size="9" fill="#374151">OBC Operational</text>
  <text x="492" y="138" text-anchor="middle" font-size="9" fill="#D97706">Compromisso → Entrega</text>

  <!-- Arrows from modes to CommitmentGate -->
  <line x1="400" y1="103" x2="412" y2="103" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="572" y1="103" x2="600" y2="103" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#aPuC)"/>
  <line x1="320" y1="148" x2="320" y2="170" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M320,170 Q320,190 450,190 Q580,190 600,170" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#aPuC)"/>

  <!-- CommitmentGate -->
  <polygon points="630,75 720,110 630,145 540,110" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3"/>
  <text x="630" y="105" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Commitment</text>
  <text x="630" y="120" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Gate</text>

  <!-- Decision note -->
  <rect x="620" y="152" width="290" height="30" fill="#F3F4F6" stroke="#C4B5FD" stroke-width="1" rx="4"/>
  <text x="765" y="165" text-anchor="middle" font-size="9" fill="#6B7280">PM + Tech Lead + Autor | Decision Package como entrada</text>
  <text x="765" y="177" text-anchor="middle" font-size="9" fill="#6B7280">6 outcomes: Promover / Restrição / Experimento / Aguardar / Descartar</text>

  <!-- ── Row 2: Five Journeys ── -->
  <line x1="630" y1="145" x2="630" y2="196" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#aPuC)"/>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="#6B7280" font-weight="600">As 5 Jornadas do Framework</text>

  <rect x="10" y="225" width="168" height="82" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="6"/>
  <text x="94" y="245" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="700">Discovery</text>
  <text x="94" y="261" text-anchor="middle" font-size="9" fill="#374151">Exploração de hipóteses</text>
  <text x="94" y="275" text-anchor="middle" font-size="9" fill="#374151">upstream-trail.md</text>
  <text x="94" y="289" text-anchor="middle" font-size="9" fill="#374151">Evidence Package</text>
  <text x="94" y="300" text-anchor="middle" font-size="8" fill="#1D4ED8">modo: Upstream</text>

  <rect x="188" y="225" width="168" height="82" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="6"/>
  <text x="272" y="245" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Delivery</text>
  <text x="272" y="261" text-anchor="middle" font-size="9" fill="#374151">Execução comprometida</text>
  <text x="272" y="275" text-anchor="middle" font-size="9" fill="#374151">Bootstrap→Promote</text>
  <text x="272" y="289" text-anchor="middle" font-size="9" fill="#374151">OBC + Release Trail</text>
  <text x="272" y="300" text-anchor="middle" font-size="8" fill="#D97706">modo: Downstream</text>

  <rect x="366" y="225" width="168" height="82" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" rx="6"/>
  <text x="450" y="245" text-anchor="middle" font-size="11" fill="#374151" font-weight="700">Operation</text>
  <text x="450" y="261" text-anchor="middle" font-size="9" fill="#374151">Produto em produção</text>
  <text x="450" y="275" text-anchor="middle" font-size="9" fill="#374151">SLOs medidos</text>
  <text x="450" y="289" text-anchor="middle" font-size="9" fill="#374151">OBC Operational</text>
  <text x="450" y="300" text-anchor="middle" font-size="8" fill="#6B7280">modo: ambos</text>

  <rect x="544" y="225" width="168" height="82" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" rx="6"/>
  <text x="628" y="245" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Assessment</text>
  <text x="628" y="261" text-anchor="middle" font-size="9" fill="#374151">Avaliação de saúde</text>
  <text x="628" y="275" text-anchor="middle" font-size="9" fill="#374151">Dependências externas</text>
  <text x="628" y="289" text-anchor="middle" font-size="9" fill="#374151">Decisions Latency</text>
  <text x="628" y="300" text-anchor="middle" font-size="8" fill="#7C3AED">modo: Upstream</text>

  <rect x="722" y="225" width="188" height="82" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="6"/>
  <text x="816" y="245" text-anchor="middle" font-size="11" fill="#B45309" font-weight="700">Diligence</text>
  <text x="816" y="261" text-anchor="middle" font-size="9" fill="#374151">KS vs ES — verificação</text>
  <text x="816" y="275" text-anchor="middle" font-size="9" fill="#374151">evento-driven, contínua</text>
  <text x="816" y="289" text-anchor="middle" font-size="9" fill="#374151">EXP-014: 53/53 PASS</text>
  <text x="816" y="300" text-anchor="middle" font-size="8" fill="#B45309">modo: ambos</text>

  <!-- ── Row 3: Magazine Siará evidence ── -->
  <line x1="460" y1="307" x2="460" y2="330" stroke="#10B981" stroke-width="1.5" marker-end="url(#aGrC)"/>
  <text x="460" y="348" text-anchor="middle" font-size="11" fill="#065F46" font-weight="600">Magazine Siará — evidência empírica do framework em operação</text>

  <!-- 4 evidence pillars -->
  <rect x="10" y="358" width="213" height="100" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" rx="6"/>
  <text x="116" y="376" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">① Modo ≠ qualidade</text>
  <text x="116" y="392" text-anchor="middle" font-size="9" fill="#374151">EXP-001/002/003: análise técnica</text>
  <text x="116" y="406" text-anchor="middle" font-size="9" fill="#374151">de alta qualidade em Upstream</text>
  <text x="116" y="420" text-anchor="middle" font-size="9" fill="#374151">sem produzir compromisso</text>
  <text x="116" y="434" text-anchor="middle" font-size="9" fill="#374151">de entrega. Modo = tipo</text>
  <text x="116" y="448" text-anchor="middle" font-size="9" fill="#374151">de compromisso.</text>

  <rect x="233" y="358" width="213" height="100" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" rx="6"/>
  <text x="339" y="376" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">② Gate sem exploração</text>
  <text x="339" y="392" text-anchor="middle" font-size="9" fill="#374151">BS-001/PI-001: demanda</text>
  <text x="339" y="406" text-anchor="middle" font-size="9" fill="#374151">confirmada, prazo 15 dias.</text>
  <text x="339" y="420" text-anchor="middle" font-size="9" fill="#374151">CommitmentGate no mesmo</text>
  <text x="339" y="434" text-anchor="middle" font-size="9" fill="#374151">dia: calibração correta,</text>
  <text x="339" y="448" text-anchor="middle" font-size="9" fill="#374151">não atalho.</text>

  <rect x="456" y="358" width="213" height="100" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" rx="6"/>
  <text x="562" y="376" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">③ Contrato → convergência</text>
  <text x="562" y="392" text-anchor="middle" font-size="9" fill="#374151">EXP-014: 53/53 PASS</text>
  <text x="562" y="406" text-anchor="middle" font-size="9" fill="#374151">EXP-015: 22/22 × 3 players</text>
  <text x="562" y="420" text-anchor="middle" font-size="9" fill="#374151">Quando OBC define eventos</text>
  <text x="562" y="434" text-anchor="middle" font-size="9" fill="#374151">observáveis, agentes de</text>
  <text x="562" y="448" text-anchor="middle" font-size="9" fill="#374151">origens diferentes convergem.</text>

  <rect x="679" y="358" width="231" height="100" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" rx="6"/>
  <text x="794" y="376" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">④ status: self</text>
  <text x="794" y="392" text-anchor="middle" font-size="9" fill="#374151">Upstream não só produz</text>
  <text x="794" y="406" text-anchor="middle" font-size="9" fill="#374151">features. Com rigor e</text>
  <text x="794" y="420" text-anchor="middle" font-size="9" fill="#374151">critério de falsificação,</text>
  <text x="794" y="434" text-anchor="middle" font-size="9" fill="#374151">produz infraestrutura</text>
  <text x="794" y="448" text-anchor="middle" font-size="9" fill="#374151">replicável: FW v1.14.0.</text>

  <!-- ── Arc closure: prologue to conclusion ── -->
  <rect x="10" y="470" width="900" height="68" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" rx="8"/>
  <text x="460" y="491" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Fechamento do arco: do prólogo à conclusão</text>
  <text x="460" y="508" text-anchor="middle" font-size="9" fill="#374151">Prólogo: "Há uma palavra que o framework inteiro tenta operacionalizar. Guarde essa palavra: compromisso."</text>
  <text x="460" y="524" text-anchor="middle" font-size="9" fill="#374151">Conclusão: PM Eugenio fecha RISK-SP-001 no mesmo dia do BS-001. A palavra foi operacionalizada — com nome, data e evidência verificável.</text>

  <!-- ── Bottom: knowledge space vs. framework output ── -->
  <rect x="10" y="548" width="900" height="160" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5" rx="8"/>
  <text x="460" y="568" text-anchor="middle" font-size="11" fill="#374151" font-weight="700">O que o framework demonstra vs. o que permanece a demonstrar</text>

  <!-- Demonstrated -->
  <rect x="22" y="578" width="420" height="118" fill="#D1FAE5" stroke="#10B981" stroke-width="1" rx="5"/>
  <text x="232" y="596" text-anchor="middle" font-size="10" fill="#065F46" font-weight="700">Demonstrado com evidência empírica</text>
  <text x="232" y="612" text-anchor="middle" font-size="9" fill="#374151">✓ Upstream como exploração de alta qualidade sem compromisso</text>
  <text x="232" y="626" text-anchor="middle" font-size="9" fill="#374151">✓ CommitmentGate calibrado ao tipo de decisão (BS-001 mesmo dia)</text>
  <text x="232" y="640" text-anchor="middle" font-size="9" fill="#374151">✓ Downstream em 15+ iterações com Release Trail completo</text>
  <text x="232" y="654" text-anchor="middle" font-size="9" fill="#374151">✓ Diligence contínua orientada a eventos — 53/53 PASS</text>
  <text x="232" y="668" text-anchor="middle" font-size="9" fill="#374151">✓ Contratos explícitos convergem agentes heterogêneos — 22/22×3</text>

  <!-- Still pending -->
  <rect x="456" y="578" width="442" height="118" fill="#FFF7ED" stroke="#F97316" stroke-width="1" rx="5"/>
  <text x="677" y="596" text-anchor="middle" font-size="10" fill="#9A3412" font-weight="700">Ainda por demonstrar</text>
  <text x="677" y="612" text-anchor="middle" font-size="9" fill="#374151">○ Trio humano pleno no CommitmentGate (3 identidades distintas registradas)</text>
  <text x="677" y="626" text-anchor="middle" font-size="9" fill="#374151">○ TTE e sinais S1-S4 como coleta automática prospectiva</text>
  <text x="677" y="640" text-anchor="middle" font-size="9" fill="#374151">○ Protocolo de regressão Downstream→Upstream em caso real</text>
  <text x="677" y="654" text-anchor="middle" font-size="9" fill="#374151">○ Ciclo end-to-end rastreável: BS → Upstream → CommitmentGate →</text>
  <text x="677" y="668" text-anchor="middle" font-size="9" fill="#374151">   Downstream → Operational com SLOs medidos + postmortem</text>
</svg>
