<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="860" height="360" fill="#F9FAFB" rx="8"/>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="500">Figura 4 — Ciclo de vida de um experimento Upstream</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="aBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="aViolet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/>
    </marker>
    <marker id="aOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="aGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9CA3AF"/>
    </marker>
    <marker id="aRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EF4444"/>
    </marker>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Timeline line -->
  <line x1="30" y1="145" x2="470" y2="145" stroke="#3B82F6" stroke-width="2"/>

  <!-- Phase 1: HypothesisFormed -->
  <circle cx="50" cy="145" r="10" fill="#3B82F6"/>
  <text x="50" y="125" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Hypothesis</text>
  <text x="50" y="112" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Formed</text>

  <!-- TTE brace -->
  <line x1="50" y1="170" x2="260" y2="170" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="155" y="185" text-anchor="middle" font-size="11" fill="#3B82F6" font-weight="600">TTE (Time-to-Evidence)</text>

  <!-- Phase 2: EvidenceThresholdReached -->
  <circle cx="280" cy="145" r="10" fill="#60A5FA"/>
  <text x="280" y="125" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Evidence</text>
  <text x="280" y="112" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Threshold</text>
  <text x="280" y="99" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Reached</text>

  <!-- Decision Latency brace -->
  <line x1="280" y1="170" x2="470" y2="170" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="375" y="185" text-anchor="middle" font-size="11" fill="#3B82F6" font-weight="600">Decision Latency</text>

  <!-- CommitmentGate diamond — maior (±40 wide, ±28 tall) para caber o texto -->
  <polygon points="510,117 550,145 510,173 470,145" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="510" y="139" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Commit</text>
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">Gate</text>

  <!-- Label acima do losango -->
  <text x="510" y="88" text-anchor="middle" font-size="10" fill="#6B7280">PM + Tech Lead + Autor</text>
  <text x="510" y="102" text-anchor="middle" font-size="10" fill="#6B7280">Decision Package</text>
  <line x1="510" y1="105" x2="510" y2="115" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Saída: Promover (direita -> Downstream) -->
  <line x1="550" y1="145" x2="624" y2="145" stroke="#10B981" stroke-width="2" marker-end="url(#aGreen)"/>
  <rect x="626" y="124" width="115" height="44" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5" rx="6"/>
  <text x="683" y="143" text-anchor="middle" font-size="12" fill="#065F46" font-weight="700">Promover</text>
  <text x="683" y="158" text-anchor="middle" font-size="10" fill="#374151">=> Downstream</text>

  <!-- Perpetual Discovery (acima) -->
  <line x1="510" y1="117" x2="510" y2="62" stroke="#EF4444" stroke-width="1.5" marker-end="url(#aRed)"/>
  <rect x="440" y="36" width="140" height="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="1" rx="4"/>
  <text x="510" y="54" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="600">Perpetual Discovery?</text>

  <!-- Requer outro experimento (esquerda-cima) -->
  <line x1="480" y1="128" x2="385" y2="62" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#aBlue)"/>
  <rect x="280" y="36" width="148" height="28" fill="#E0F2FE" stroke="#3B82F6" stroke-width="1" rx="4"/>
  <text x="354" y="54" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="600">Requer outro experimento</text>

  <!-- Descartar (direita-cima) -->
  <line x1="548" y1="130" x2="644" y2="62" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#aGray)"/>
  <rect x="646" y="36" width="100" height="28" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" rx="4"/>
  <text x="696" y="54" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="600">Descartar</text>

  <!-- Aguardar (direita-baixo) -->
  <line x1="548" y1="158" x2="640" y2="205" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#aGray)"/>
  <rect x="642" y="190" width="175" height="28" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" rx="4"/>
  <text x="729" y="208" text-anchor="middle" font-size="10" fill="#6B7280" font-weight="600">Aguardar decisao / dependencia</text>

  <!-- Total cycle label -->
  <rect x="20" y="205" width="470" height="36" fill="#E0F2FE" rx="6"/>
  <text x="235" y="222" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="600">TTE + Decision Latency = ciclo de vida total no Upstream</text>
  <text x="235" y="235" text-anchor="middle" font-size="10" fill="#374151">Perpetual Discovery: nenhum dos dois avancos acontece</text>

  <!-- 6 outcomes label — deslocado para y=255 para não sobrepor o box acima -->
  <rect x="510" y="255" width="330" height="88" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1" rx="6"/>
  <text x="675" y="273" text-anchor="middle" font-size="11" fill="#7C3AED" font-weight="700">6 outcomes do CommitmentGate</text>
  <!-- Coluna 1: outcomes 1-3 -->
  <text x="520" y="291" text-anchor="start" font-size="9" fill="#374151">1. Promover</text>
  <text x="520" y="307" text-anchor="start" font-size="9" fill="#374151">2. Promover com restricao</text>
  <text x="520" y="323" text-anchor="start" font-size="9" fill="#374151">3. Requer outro experimento</text>
  <!-- Coluna 2: outcomes 4-6 -->
  <text x="668" y="291" text-anchor="start" font-size="9" fill="#374151">4. Aguardar decisao de negocio</text>
  <text x="668" y="307" text-anchor="start" font-size="9" fill="#374151">5. Aguardar dependencia externa</text>
  <text x="668" y="323" text-anchor="start" font-size="9" fill="#374151">6. Descartar</text>
</svg>
