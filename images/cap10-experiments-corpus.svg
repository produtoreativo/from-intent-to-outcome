  <text x="155" y="222" text-anchor="middle" font-size="9" fill="#374151">EXP-010: Datadog APM + Trace ID em eventos</text>
  <text x="155" y="236" text-anchor="middle" font-size="9" fill="#374151">EXP-012: Release Trail automático via CloudEvents</text>
  <text x="155" y="250" text-anchor="middle" font-size="9" fill="#374151">EXP-014: Diligence em tempo real — 53/53 PASS</text>
