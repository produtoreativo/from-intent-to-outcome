  <text x="155" y="308" text-anchor="middle" font-size="10" fill="#1D4ED8" font-weight="700">Agentes como produtores (EXP-015)</text>
  <text x="155" y="324" text-anchor="middle" font-size="9" fill="#374151">22 cenários × 3 players (claude/codex/copilot)</text>
  <text x="155" y="338" text-anchor="middle" font-size="9" fill="#374151">100% conformance — zero divergências semânticas</text>
