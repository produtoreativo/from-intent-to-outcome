  <text x="159" y="596" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="700">Trio humano pleno no CommitmentGate</text>
  <text x="159" y="612" text-anchor="middle" font-size="9" fill="#374151">PM como decisor de negócio: registrado.</text>
  <text x="159" y="626" text-anchor="middle" font-size="9" fill="#374151">Autor independente (engenheiro que não</text>
  <text x="159" y="640" text-anchor="middle" font-size="9" fill="#374151">conduziu o experimento): não registrado</text>
  <text x="159" y="654" text-anchor="middle" font-size="9" fill="#374151">com identidade distinta em caso real.</text>
  <text x="159" y="668" text-anchor="middle" font-size="9" fill="#374151">Mecanismo funciona; composição plena: pendente.</text>

  <rect x="309" y="578" width="275" height="98" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" rx="4"/>
  <text x="446" y="596" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="700">TTE e sinais S1-S4 prospectivos</text>
  <text x="446" y="612" text-anchor="middle" font-size="9" fill="#374151">EXP-014: Diligence rastreia Execution Space.</text>
  <text x="446" y="626" text-anchor="middle" font-size="9" fill="#374151">Instrumentação proativa de TTE, Decision</text>
  <text x="446" y="640" text-anchor="middle" font-size="9" fill="#374151">Latency e Discovery WIP (sinais S1-S4)</text>
  <text x="446" y="654" text-anchor="middle" font-size="9" fill="#374151">como coleta automática: proposta,</text>
  <text x="446" y="668" text-anchor="middle" font-size="9" fill="#374151">não implementada.</text>

  <rect x="596" y="578" width="302" height="98" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" rx="4"/>
  <text x="747" y="596" text-anchor="middle" font-size="9" fill="#9A3412" font-weight="700">Regressão Downstream→Upstream em caso real</text>
  <text x="747" y="612" text-anchor="middle" font-size="9" fill="#374151">Protocolo definido e presente no framework.</text>
  <text x="747" y="626" text-anchor="middle" font-size="9" fill="#374151">15 iterações documentadas: nenhuma precisou</text>
  <text x="747" y="640" text-anchor="middle" font-size="9" fill="#374151">regredir. Validade operacional do protocolo</text>
  <text x="747" y="654" text-anchor="middle" font-size="9" fill="#374151">em caso real de divergência: aguarda</text>
  <text x="747" y="668" text-anchor="middle" font-size="9" fill="#374151">evidência empírica.</text>
