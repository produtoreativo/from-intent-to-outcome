  <text x="145" y="175" text-anchor="middle" font-size="9" fill="#374151">Experimento como unidade</text>

  <line x1="253" y1="154" x2="279" y2="154" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arr-b)"/>

