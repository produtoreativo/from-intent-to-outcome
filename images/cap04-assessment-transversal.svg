  <rect x="520" y="128" width="215" height="52" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="4"/>
  <text x="627" y="148" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="700">Operation</text>
  <text x="627" y="163" text-anchor="middle" font-size="9" fill="#374151">Experimental</text>
  <text x="627" y="175" text-anchor="middle" font-size="9" fill="#374151">Sandbox · sem SLO formal</text>

