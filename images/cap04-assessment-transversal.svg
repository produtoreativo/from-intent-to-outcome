  <!-- ═══════════════════════════════════════════
       ROW 1 — MODO UPSTREAM
       ══════════════════════════════════════════ -->

  <!-- Outer frame -->
  <rect x="20" y="36" width="760" height="152" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="6"/>

