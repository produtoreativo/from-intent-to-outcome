  <!-- Discovery -->
  <rect x="38" y="328" width="215" height="52" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
  <text x="145" y="348" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Discovery</text>
  <text x="145" y="363" text-anchor="middle" font-size="9" fill="#374151">Preparatório · OBC → Committed</text>
  <text x="145" y="375" text-anchor="middle" font-size="9" fill="#374151">BDD Feature · Readiness Gate</text>

  <line x1="253" y1="354" x2="279" y2="354" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Delivery -->
  <rect x="279" y="328" width="215" height="52" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
  <text x="386" y="348" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Delivery</text>
  <text x="386" y="363" text-anchor="middle" font-size="9" fill="#374151">Obrigatório · gates bloqueantes</text>
  <text x="386" y="375" text-anchor="middle" font-size="9" fill="#374151">Bootstrap→Hack→Sync→Ship→Promote</text>

  <line x1="494" y1="354" x2="520" y2="354" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Operation -->
  <rect x="520" y="328" width="215" height="52" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="4"/>
  <text x="627" y="348" text-anchor="middle" font-size="11" fill="#D97706" font-weight="700">Operation</text>
  <text x="627" y="363" text-anchor="middle" font-size="9" fill="#374151">Produção real · SLOs ativos</text>
  <text x="627" y="375" text-anchor="middle" font-size="9" fill="#374151">Runbooks · protocolo de incidentes</text>

  <!-- Footer note -->
  <text x="400" y="408" text-anchor="middle" font-size="9" fill="#6B7280">Assessment não é uma fase — é uma camada de governança informacional paralela a todas as jornadas, em ambos os modos</text>
