  <rect x="32" y="72" width="736" height="48" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="4"/>
  <text x="400" y="91" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="700">Assessment</text>
  <text x="400" y="107" text-anchor="middle" font-size="9" fill="#5B21B6">Dimensão Prospectiva ativa: avalia contexto para o CommitmentGate · ciclo Assíncrono em monitoramento contínuo</text>

  <!-- Journey boxes: y=128, h=52 -->

