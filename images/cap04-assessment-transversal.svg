  <rect x="279" y="128" width="215" height="52" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" rx="4"/>
  <text x="386" y="148" text-anchor="middle" font-size="11" fill="#1D4ED8" font-weight="700">Delivery</text>
  <text x="386" y="163" text-anchor="middle" font-size="9" fill="#374151">Advisory · fases opcionais</text>
  <text x="386" y="175" text-anchor="middle" font-size="9" fill="#374151">Engenheiro decide profundidade</text>

  <line x1="494" y1="154" x2="520" y2="154" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arr-b)"/>

